app:
  id: ari:cloud:ecosystem::app/026c4f6a-266d-4c42-aec5-7394371ad05d
  runtime:
    name: nodejs24.x
  licensing:
    enabled: true
modules:
  # One Jira admin menu entry; in-app navigation (side navigation) lives inside the Custom UI.
  # Mirrors MarginRadar: three adminPage modules on one resource, layout blank (the app owns its padding).
  jira:adminPage:
    - key: accessradar-admin
      resource: custom-ui
      resolver:
        function: ar-resolver
      title: AccessRadar
      icon: resource:icons;accessradar.svg
      layout: blank
    - key: accessradar-config
      resource: custom-ui
      resolver:
        function: ar-resolver
      title: AccessRadar configuration
      icon: resource:icons;accessradar.svg
      useAsConfig: true
      layout: blank
    - key: accessradar-get-started
      resource: custom-ui
      resolver:
        function: ar-resolver
      title: Get started with AccessRadar
      icon: resource:icons;accessradar.svg
      useAsGetStarted: true
      layout: blank
  scheduledTrigger:
    - key: accessradar-snapshot-tick
      function: ar-tick
      interval: hour
    - key: accessradar-privacy-daily
      function: ar-privacy
      interval: day
  trigger:
    - key: accessradar-lifecycle
      function: ar-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  consumer:
    - key: accessradar-collect-consumer
      queue: accessradar-collect
      function: ar-collector
  sql:
    - key: main
      engine: mysql
  # Project-owner delegated reviews (Advanced). No new scopes.
  jira:projectSettingsPage:
    - key: accessradar-project-review
      resource: custom-ui
      resolver:
        function: ar-project-resolver
      title: Access review
      icon: resource:icons;accessradar.svg
      layout: blank
  # Read-only Rovo agent (Advanced). No egress / remotes / Connect — keeps Runs on Atlassian.
  rovo:agent:
    - key: accessradar-agent
      name: AccessRadar
      description: Answers who has access to what in Jira, why, and what changed — from AccessRadar snapshots. Read-only.
      icon: resource:icons;accessradar.svg
      prompt: resource:rovo-prompt;agent.md
      conversationStarters:
        - Who can administer project PAY?
        - What changed since the last snapshot?
        - Which access reviews are overdue?
      actions:
        - ar-who-can-access
        - ar-why
        - ar-changes-since
        - ar-review-status
        - ar-person-access
  action:
    - key: ar-who-can-access
      name: Who can access a project
      function: ar-rovo
      actionVerb: GET
      description: List people and groups with permissions on a project, from the latest AccessRadar snapshot.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key (e.g. PAY)
        permission:
          title: Permission
          type: string
          required: false
          description: Optional Jira permission key (e.g. ADMINISTER_PROJECTS)
    - key: ar-why
      name: Why someone has access
      function: ar-rovo
      actionVerb: GET
      description: Explain the grant path for a person or group on a project permission.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key
        accountId:
          title: Account ID
          type: string
          required: false
          description: Atlassian accountId when known
        name:
          title: Display name
          type: string
          required: false
          description: Display name if accountId is unknown
        permission:
          title: Permission
          type: string
          required: false
          description: Optional permission to focus on
    - key: ar-changes-since
      name: Changes since a snapshot
      function: ar-rovo
      actionVerb: GET
      description: List access granted and revoked between two AccessRadar snapshots.
      inputs:
        sinceSeq:
          title: Since snapshot
          type: string
          required: false
          description: Earlier snapshot sequence number
        sinceDate:
          title: Since date
          type: string
          required: false
          description: ISO date; uses the latest snapshot at or before that time
    - key: ar-review-status
      name: Access review status
      function: ar-rovo
      actionVerb: GET
      description: List open, overdue and signed access reviews from AccessRadar.
      inputs:
        campaign:
          title: Campaign filter
          type: string
          required: false
          description: Optional campaign name filter
    - key: ar-person-access
      name: Person access across projects
      function: ar-rovo
      actionVerb: GET
      description: List projects and key permissions for one person from the latest snapshot.
      inputs:
        accountId:
          title: Account ID
          type: string
          required: false
          description: Atlassian accountId when known
        name:
          title: Display name
          type: string
          required: false
          description: Display name if accountId is unknown
  function:
    - key: ar-resolver
      handler: index.resolver
    - key: ar-tick
      handler: index.tick
      timeoutSeconds: 30
    - key: ar-collector
      handler: index.collector
      timeoutSeconds: 900
    - key: ar-privacy
      handler: index.privacy
      timeoutSeconds: 60
    - key: ar-lifecycle
      handler: index.lifecycle
    - key: ar-rovo
      handler: index.rovo
    - key: ar-project-resolver
      handler: index.projectResolver

resources:
  - key: icons
    path: resources/icons
  - key: custom-ui
    path: static/app/dist
  - key: rovo-prompt
    path: resources/rovo
permissions:
  content:
    styles:
      - unsafe-inline
  scopes:
    read:project:jira:
      allowImpersonation: true
    read:permission-scheme:jira:
      allowImpersonation: true
    read:permission:jira:
      allowImpersonation: true
    read:project-role:jira:
      allowImpersonation: true
    read:group:jira:
      allowImpersonation: true
    read:user:jira:
      allowImpersonation: true
    read:avatar:jira:
      allowImpersonation: true
    read:application-role:jira:
      allowImpersonation: true
    read:field:jira:
      allowImpersonation: true
    read:project-category:jira:
      allowImpersonation: true
    read:issue-type:jira:
      allowImpersonation: true
    read:project.property:jira:
      allowImpersonation: true
    read:issue-type-hierarchy:jira:
      allowImpersonation: true
    read:project-version:jira:
      allowImpersonation: true
    read:project.component:jira:
      allowImpersonation: true
    report:personal-data: {}
