name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ui
      - run: npm audit --omit=dev --audit-level=high
      # forge lint needs Forge credentials and the Forge API, which timed out intermittently here
      # ("Request timed out after 300000ms") and is unavailable to Dependabot PRs. It runs with
      # retries in deploy-dev.yml, right before every deploy, which is where it gates anything.
      # The production build must not contain the development-only spike/self-test code.
      - name: Production strip builds
        run: |
          bash scripts/strip-spike.sh
          npm run typecheck
          npm run build:ui
