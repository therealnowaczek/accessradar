name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/accessradar-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/accessradar-ui
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ui
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix static/accessradar-ui
      - name: forge lint (fails only on errors)
        run: npx --yes @forge/cli@14 lint
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
