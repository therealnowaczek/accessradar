name: CI
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ui
      - run: npm audit --omit=dev --audit-level=high
      # forge lint needs Forge credentials and the Forge API; it runs in deploy when manifest.yml changes.
      # The production build must not contain the development-only spike/self-test code.
      - name: Production strip builds
        run: |
          bash scripts/strip-spike.sh
          npm run typecheck
          npm run build:ui
